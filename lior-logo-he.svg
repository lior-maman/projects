<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="512" height="512" role="img" aria-label="Logo">
      <defs>
        <linearGradient id="gBlue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1E5BFF"/><stop offset="1" stop-color="#0B3AC7"/></linearGradient>
        <linearGradient id="gSmile" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22D3EE"/><stop offset="1" stop-color="#1E5BFF"/></linearGradient>
        <linearGradient id="gTile" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1E5BFF"/><stop offset="1" stop-color="#0B3AC7"/></linearGradient>
      </defs>
      <g transform="translate(256,0) scale(-1,1)">
        <!-- Hebrew Lamed (ל) drawn per description: top vertical flag on the right,
             horizontal to the left, vertical down to baseline, small diagonal tail -->
        <g fill="none" stroke="url(#gBlue)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
          <path d="M160 40 L160 90 L100 90 L100 150 L118 170"/>
        </g>
        <!-- dots that arc upward like a smile + arrow (identical to L version) -->
        <circle cx="80"  cy="196" r="9"  fill="#22D3EE"/>
        <circle cx="120" cy="206" r="10" fill="#3B82F6"/>
        <circle cx="160" cy="192" r="11" fill="#1E5BFF"/>
        <path d="M172 184 l14 -2 l-6 16 Z" fill="#1E5BFF"/></g>
    </svg>